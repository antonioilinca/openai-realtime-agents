version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    depends_on:
      - backend
    command: ["npm", "run", "dev"]
    volumes:
      - .:/app
      - /app/node_modules

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - opensearch
      - redis
    command: ["uvicorn", "lexora.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lexora
      POSTGRES_PASSWORD: lexora
      POSTGRES_DB: lexora
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  pgdata:
